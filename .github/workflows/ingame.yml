name: ingame
# 매일 KST 11:20 — 인생 2막 보드와 같은 시각(둘을 나란히 볼 때 기준일이 어긋나지 않게).
on:
  schedule: [{cron: "20 2 * * *"}]     # 02:20 UTC = 11:20 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q google-cloud-bigquery
      - name: 서비스계정 키 쓰기
        # ★키는 파일로만 쓰고 로그에 절대 안 남긴다. 레포에 커밋되지 않도록 /tmp 에 둔다.
        run: |
          printf '%s' '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          python3 -c "import json;json.load(open('/tmp/sa.json'));print('키 형식 OK')"
      - name: 쿼리 자가검증
        # ★수집 전에 **답을 아는 입력**으로 쿼리를 먼저 돌린다. 쿼리가 틀린 채로
        #   수집하면 그럴듯한 숫자가 JSON 에 박혀서, 틀렸다는 걸 알 길이 없다.
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          BQ_PROJECT: ${{ vars.BQ_PROJECT }}
          BQ_LOCATION: ${{ vars.BQ_LOCATION }}
        run: python3 tools/selftest.py

      - name: 수집
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          BQ_PROJECT: ${{ vars.BQ_PROJECT }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
          BQ_LOCATION: ${{ vars.BQ_LOCATION }}
          EXCLUDE_USERS: ${{ vars.EXCLUDE_USERS }}
        run: |
          python3 tools/ingame.py
          python3 tools/users.py
      - name: 페이지 검사
        # ★Pages 가 200 을 준다고 화면이 그려지는 건 아니다. app.js 가 한 줄에서
        #   터지면 흰 화면이 뜨는데 배포는 "성공"으로 남는다. 실데이터와 **빈 데이터**
        #   둘 다로 끝까지 돌려 본다 — 지금은 대부분 섹션이 비어 있는 게 평소 상태다.
        run: |
          python3 tools/wftest.py
          node tools/pagetest.js
          MODE=empty node tools/pagetest.js

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/ingame.json docs/data/users
          git diff --staged --quiet || git commit -m "지표 갱신 $(date -u +%Y-%m-%d)"
          # ★되감고 올린다. "대시보드 업데이트"는 ingame 과 realtime 을 **같이** 돌리는
          #   명령이라 둘이 동시에 푸시한다 — 되감기가 없으면 늦은 쪽이 매번 터진다
          #   (실제로 터졌다 2026-10-12). 수집기가 만드는 파일뿐이라 rebase 로 잃을 게 없다.
          git pull --rebase -q || true
          git push
