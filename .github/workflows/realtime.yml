name: realtime
# ★인게임(하루 1회)과 **따로** 돈다. intraday 는 후처리 전이라 성격이 다르고,
# 보는 목적도 다르다 — "지금 들어온 사람이 어디까지 갔나"는 자주 봐야 의미가 있다.
# 30분마다. 유저가 거의 없는 지금은 과하지만, 광고를 돌리는 날 이 간격이 필요해진다.
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q google-cloud-bigquery
      - name: 서비스계정 키 쓰기
        # ★키는 파일로만 쓰고 로그에 절대 안 남긴다. 레포에 커밋되지 않도록 /tmp 에 둔다.
        run: |
          printf '%s' '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          python3 -c "import json;json.load(open('/tmp/sa.json'));print('키 형식 OK')"
      - name: 수집
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          BQ_PROJECT: ${{ vars.BQ_PROJECT }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
          BQ_LOCATION: ${{ vars.BQ_LOCATION }}
          EXCLUDE_USERS: ${{ vars.EXCLUDE_USERS }}
        run: python3 tools/ingame.py
      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/ingame.json
          git diff --staged --quiet || git commit -m "실시간 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          # ★실시간은 30분마다 커밋한다. 충돌이 잦으므로 되감고 다시 올린다
          #   (수집기가 만드는 파일 한 장이라 rebase 로 잃을 게 없다).
          git pull --rebase -q || true
          git push
